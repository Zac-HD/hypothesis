# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

formats:
  - htmlzip
  - epub
  # - pdf  # busted by latex crash on unicode U+030A combining ring above, in text() docs

build:
   os: ubuntu-22.04
   tools:
      python: "3.14"
      rust: "latest"
   jobs:
      post_install:
         - python -m pip install uv
         - python -m uv sync --directory ./hypothesis --locked --group tools --all-extras --active
sphinx:
   configuration: hypothesis/docs/conf.py
