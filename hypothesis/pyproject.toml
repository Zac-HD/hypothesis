[build-system]
requires = ["maturin>=1.9.4,<2.0"]
build-backend = "maturin"

[project]
name = "hypothesis"
# see [tool.setuptools.dynamic]
dynamic = ["version"]
authors = [
    { name = "David R. MacIver and Zac Hatfield-Dodds", email = "david@drmaciver.com" }
]
description = "The property-based testing library for Python"

license = "MPL-2.0"
# explicit reference the license file to work around a bug (?) in maturin where it
# doesn't auto-include the license file for sdists
license-files = ["LICENSE.txt"]
requires-python = ">= 3.10"
keywords = ["python", "testing", "fuzzing", "property-based-testing"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Hypothesis",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: Unix",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Education :: Testing",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

dependencies = [
    "exceptiongroup>=1.0.0; python_version<'3.11'",
    "sortedcontainers>=2.1.0,<3.0.0",
]

# Avoid changing this by hand. This is automatically updated by update_changelog_and_version.
[project.readme]
text = """<div align="center">
  <img src="https://raw.githubusercontent.com/HypothesisWorks/hypothesis/master/brand/dragonfly-rainbow.svg" width="300">
</div>

# Hypothesis

* [Website](https://hypothesis.works/)
* [Documentation](https://hypothesis.readthedocs.io/en/latest/)
* [Source code](https://github.com/hypothesisWorks/hypothesis/)
* [Contributing](https://github.com/HypothesisWorks/hypothesis/blob/master/CONTRIBUTING.rst)
* [Community](https://hypothesis.readthedocs.io/en/latest/community.html)

Hypothesis is the property-based testing library for Python. With Hypothesis, you write tests which should pass for all inputs in whatever range you describe, and let Hypothesis randomly choose which of those inputs to check - including edge cases you might not have thought about. For example:

```python
from hypothesis import given, strategies as st


@given(st.lists(st.integers()))
def test_matches_builtin(ls):
    assert sorted(ls) == my_sort(ls)
```

This randomized testing can catch bugs and edge cases that you didn't think of and wouldn't have found. In addition, when Hypothesis does find a bug, it doesn't just report any failing test case — it reports the simplest possible one. This makes property-based tests a powerful tool for debugging, as well as testing.

For instance,

```python
def my_sort(ls):
    return sorted(set(ls))
```

fails with the simplest possible failing test case:

```
Failing test case: test_matches_builtin(ls=[0, 0])
```

### Installation

To install Hypothesis:

```
pip install hypothesis
```

There are also [optional extras available](https://hypothesis.readthedocs.io/en/latest/extras.html).
"""
content-type = "text/markdown"

[project.urls]
homepage = "https://hypothesis.works"
source = "https://github.com/HypothesisWorks/hypothesis"
changelog = "https://hypothesis.readthedocs.io/en/latest/changelog.html"
documentation = "https://hypothesis.readthedocs.io"
issues = "https://github.com/HypothesisWorks/hypothesis/issues"

[project.optional-dependencies]
cli = ["click>=7.0", "black>=20.8b0", "rich>=9.0.0"]
codemods = ["libcst>=0.3.16"]
ghostwriter = ["black>=20.8b0"]
pytz = ["pytz>=2014.1"]
dateutil = ["python-dateutil>=1.4"]
lark = ["lark>=0.10.1"]  # probably still works with old `lark-parser` too
numpy = ["numpy>=1.21.6"]  # oldest with wheels for non-EOL Python (for now)
pandas = ["pandas>=1.1"]
pytest = ["pytest>=4.6"]
dpcontracts = ["dpcontracts>=0.4"]
redis = ["redis>=3.0.0"]
crosshair = ["hypothesis-crosshair>=0.0.29", "crosshair-tool>=0.0.109"]
# zoneinfo is an odd one: every dependency is platform-conditional.
zoneinfo = ["tzdata>=2026.3; sys_platform == 'win32' or sys_platform == 'emscripten'"]
# We only support Django versions with upstream support - see
# https://www.djangoproject.com/download/#supported-versions
# We also leave the choice of timezone library to the user, since it
# might be zoneinfo or pytz depending on version and configuration.
django = ["django>=5.2"]
watchdog = ["watchdog>=4.0.0"]
# Avoid changing this by hand. This is automatically updated by update_changelog_and_version
all = ["black>=20.8b0", "click>=7.0", "crosshair-tool>=0.0.109", "django>=5.2", "dpcontracts>=0.4", "hypothesis-crosshair>=0.0.29", "lark>=0.10.1", "libcst>=0.3.16", "numpy>=1.21.6", "pandas>=1.1", "pytest>=4.6", "python-dateutil>=1.4", "pytz>=2014.1", "redis>=3.0.0", "rich>=9.0.0", "tzdata>=2026.3; sys_platform == 'win32' or sys_platform == 'emscripten'", "watchdog>=4.0.0"]

[project.scripts]
hypothesis = "hypothesis.extra.cli:main"

[project.entry-points.pytest11]
hypothesispytest = "_hypothesis_pytestplugin"

# Development dependencies.  These are PEP 735 groups, which are *not* published
# in our wheel metadata, so they cost downstream users nothing.  Every version
# here is resolved into uv.lock; nothing is installed at test time.
[dependency-groups]
# The base harness, shared by nearly every environment.
test = ["pexpect", "pytest", "pytest-xdist", "syrupy"]

# Dev-only companions for extras which are exercised in isolation.  Where an
# extra is enough on its own (lark, dpcontracts, ...) the tox env just sets
# `extras =` and needs no group here.
annotated-types = ["annotated-types", {include-group = "test"}]
attrs = ["attrs", {include-group = "test"}]
ghostwriter = ["black", "attrs", {include-group = "coverage"}]
patching = ["black", "libcst", {include-group = "test"}]
redis = ["fakeredis", {include-group = "test"}]
# scipy trails numpy's latest release, so it caps numpy for the whole lock.
scipy = ["scipy", {include-group = "test"}]
typing-extensions = ["typing-extensions", {include-group = "test"}]

# Everything at once, for the coverage run.
coverage = [
    "annotated-types",
    "black",
    "click",
    "coverage-enable-subprocess",
    "dpcontracts",
    "fakeredis",
    "lark",
    "libcst",
    "numpy",
    "pandas",
    "pyarrow",  # silence a warning from pandas >=2.2,<3
    "pytest-cov",
    "python-dateutil",
    "pytz",
    "typing-extensions",
    "watchdog",
    {include-group = "test"},
]
crosshair = ["crosshair-tool", "hypothesis-crosshair", "pytest-repeat", {include-group = "test"}]
fuzzing = ["hypofuzz", {include-group = "coverage"}]
threading = [
    # in pytest-run-parallel==0.7.0, python3.10 + pytest-run-parallel + xdist does
    # not collect any tests. I don't know why.
    "pytest-run-parallel==0.6.0",
    {include-group = "test"},
]

ci = ["tox", "tox-uv>=1.35"]

# NOTE: no [tool.uv].conflicts here, deliberately.  As of uv 0.8.17 a lockfile
# that declares conflicts can never satisfy `uv lock --check` / `uv sync
# --locked` - it reports the lock as stale even immediately after writing it -
# and verifying the lock in every CI job is the entire point.  So this project
# stays conflict-free, and everything that needs a conflicting pin lives in
# ci-matrix/, which is verified by re-locking in CI rather than by --locked.

# The deliberately-off-latest version matrix (old pandas, old pytest, oldest
# numpy, ...) lives in its own project at ci-matrix/, because declaring those
# groups as mutually exclusive here would fork this resolution hundreds of ways.
# See ci-matrix/pyproject.toml.

[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-source = "src"
module-name = "hypothesis._native"
include = [
    { path = "src/_hypothesis_globals.py", format = ["sdist", "wheel"] },
    { path = "src/_hypothesis_ftz_detector.py", format = ["sdist", "wheel"] },
    { path = "src/_hypothesis_pytestplugin.py", format = ["sdist", "wheel"] },
    { path = "src/hypothesis/vendor/tlds-alpha-by-domain.txt", format = ["sdist", "wheel"] },
    { path = "rust/Cargo.lock", format = "sdist" },
]
# maturin doesn't seem to exclude __pycache__ in dists by default
exclude = [
    { path = "**/__pycache__/**", format = ["sdist", "wheel"] },
]

[tool.coverage.run]
parallel = true
branch = true
source = ["hypothesis"]
omit = [
    "**/_hypothesis_ftz_detector.py",
    "**/_hypothesis_pytestplugin.py",
    "**/_hypothesis_globals.py",
    "**/extra/array_api.py",
    "**/extra/cli.py",
    "**/extra/django/*.py",
    "**/extra/ghostwriter.py",
    "**/extra/pytestplugin.py",
    "**/internal/scrutineer.py",
    "**/utils/terminal.py",
    "**/internal/conjecture/provider_conformance.py",
    # covered by our attrs tests in check-niche
    "**/strategies/_internal/attrs.py"
]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "def __repr__",
    "def _repr_pretty_",
    "def __ne__",
    "def __copy__",
    "def __deepcopy__",
    "except ImportError:",
    "except ModuleNotFoundError:",
    "if PYPY:",
    "if TYPE_CHECKING:",
    "if sys\\.version_info",
    "if \"[\\w\\.]+\" in sys\\.modules:",
    "if .+ := sys\\.modules\\.get\\(\"[\\w\\.]+\"\\)",
    "@overload",
    "if .*\\bnot .*provider.avoid_realization",
]
