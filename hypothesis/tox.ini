[tox]
envlist = py{310,py310,311,py311,312,313,314,314t,315,315t}-{brief,cover,rest,nocover,custom}
toxworkdir={env:TOX_WORK_DIR:.tox}
# Every environment is synced from uv.lock, so a CI job can only ever install a
# version we have committed.
requires = tox-uv>=1.35
runner = uv-venv-lock-runner

[testenv]
runner = uv-venv-lock-runner
basepython={env:TOX_PYTHON_VERSION:python3}
dependency_groups = test
extras = zoneinfo
passenv=
    HOME
    LC_ALL
    COVERAGE_FILE
    TOXENV
    # Allow CI builds (or user builds) to force coloured terminal output.
    PY_COLORS
    CARGO_BUILD_TARGET  # for our windows 32bit tests
    RUSTUP_HOME
    CARGO_HOME
    RUSTUP_TOOLCHAIN
    MATURIN_PEP517_ARGS
setenv =
    # If PY...ING is set in calling environment, use that; default to 1
    PYTHONWARNDEFAULTENCODING={env:PYTHONWARNDEFAULTENCODING:1}
    brief: HYPOTHESIS_PROFILE=speedy
commands =
    brief: python -bb -X dev -m pytest -n auto tests/cover/test_testdecorators.py {posargs}
    cover: python -bb -X dev -m pytest -n auto tests/cover/ tests/pytest/ tests/conjecture/ {posargs}
    rest: python -bb -X dev -m pytest -n auto tests/ --ignore=tests/cover/ --ignore=tests/pytest/ --ignore=tests/conjecture/ --ignore=tests/nocover/ --ignore=tests/quality/ --ignore=tests/ghostwriter/ --ignore=tests/patching/ --ignore=tests/crosshair/test_crosshair.py --ignore=tests/scipy/ --ignore=tests/snapshots/ {posargs}
    conjecture: python -bb -X dev -m pytest -n auto tests/conjecture/ {posargs}
    nocover: python -bb -X dev -m pytest -n auto tests/nocover/ {posargs}
    custom: python -bb -X dev -m pytest {posargs}

# One environment per optional extra, replacing the serial install/uninstall
# sequence that scripts/basic-test.sh and scripts/other-tests.sh used to run.
# `uv sync` prunes anything outside the requested groups, so each extra really
# is exercised in isolation - which `pip uninstall -y` never managed, since it
# leaves transitive dependencies behind.
[testenv:extra-{datetime,dpcontracts,redis,typingext,annotated,attrs,scipy,lark,codemods,patching,ghostwriter,django,numpy,pandas,watchdog}]
extras =
    datetime: pytz
    datetime: dateutil
    datetime: zoneinfo
    dpcontracts: dpcontracts
    redis: redis
    lark: lark
    codemods: codemods
    codemods: cli
    ghostwriter: ghostwriter
    django: django
    numpy: numpy
    pandas: pandas
    watchdog: watchdog
dependency_groups =
    datetime: test
    dpcontracts: test
    lark: test
    codemods: test
    numpy: test
    pandas: test
    watchdog: test
    django: test
    redis: redis
    typingext: typing-extensions
    annotated: annotated-types
    attrs: attrs
    scipy: scipy
    patching: patching
    ghostwriter: ghostwriter
setenv =
    PYTHONWARNDEFAULTENCODING=1
    django: DJANGO_SETTINGS_MODULE=tests.django.toys.settings.settings
    django: HYPOTHESIS_DJANGO_USETZ=TRUE
commands =
    datetime: python -bb -X dev -m pytest -n auto tests/datetime/ {posargs}
    dpcontracts: python -bb -X dev -m pytest -n auto tests/dpcontracts/ {posargs}
    redis: python -bb -X dev -m pytest -n auto tests/redis/ {posargs}
    typingext: python -bb -X dev -m pytest -n auto tests/typing_extensions/ {posargs}
    annotated: python -bb -X dev -m pytest -n auto tests/test_annotated_types.py {posargs}
    attrs: python -bb -X dev -m pytest -n auto tests/attrs/ {posargs}
    scipy: python -bb -X dev -m pytest -n auto tests/scipy/ {posargs}
    lark: python -bb -X dev -m pytest -n auto tests/lark/ {posargs}
    codemods: python -bb -X dev -m pytest -n auto tests/codemods/ {posargs}
    patching: python -bb -X dev -m pytest -n auto tests/patching/ {posargs}
    ghostwriter: python -bb -X dev -m pytest -n auto tests/ghostwriter/ {posargs}
    numpy: python -bb -X dev -m pytest -n auto tests/numpy/ tests/array_api/ {posargs}
    pandas: python -bb -X dev -m pytest -n auto tests/pandas/ {posargs}
    watchdog: python -bb -X dev -m pytest -n auto tests/watchdog/ {posargs}
    django: python -bb -X dev -m tests.django.manage test tests.django {posargs}

# The oldest lark we claim to support, from the version-matrix project.
[testenv:larkmin]
package = skip
package_root = ci-matrix
# see the note in ci-matrix/pyproject.toml: --locked can't verify a lock
# that declares conflicts, so these envs use --frozen and CI re-locks instead.
uv_sync_locked = false
uv_sync_flags = --frozen
dependency_groups = larkmin
commands =
    python -bb -X dev -m pytest -n auto -Wignore tests/lark/ {posargs}

# Run some tests without docstrings or assertions, to catch bugs
# like issue #822 in one of the test decorators.  See also #1541.
[testenv:optimized]
setenv=
    PYTHONOPTIMIZE=2
commands =
    python -bb -X dev -m pytest -n auto \
        -W'ignore:assertions not in test modules or plugins will be ignored because assert statements are not executed by the underlying Python interpreter:pytest.PytestConfigWarning' \
        -W'ignore:Module already imported so cannot be rewritten:pytest.PytestAssertRewriteWarning' \
        tests/cover/test_testdecorators.py {posargs}

[testenv:snapshots]
commands =
    python -bb -X dev -m pytest tests/snapshots/ {posargs}

[testenv:quality]
commands=
    python -bb -X dev -m pytest tests/quality/ -n auto

# This test job runs on the oldest version of CPython we support, against the minimum
# version specified in our runtime dependencies.  For now, that's the oldest version
# with a wheel for non-EOL Python.  In future we might deprecate faster per NEP-29.
[testenv:py310-oldestnumpy]
package = skip
package_root = ci-matrix
# see the note in ci-matrix/pyproject.toml: --locked can't verify a lock
# that declares conflicts, so these envs use --frozen and CI re-locks instead.
uv_sync_locked = false
uv_sync_flags = --frozen
dependency_groups = oldestnumpy
commands =
    python -bb -X dev -m pytest tests/numpy/ -n auto

# The one environment we deliberately do *not* lock: its entire purpose is to
# fail when a future numpy breaks us, so it must float.  Not a required check.
[testenv:numpy-nightly]
runner = uv-venv-runner
uv_seed = true
dependency_groups = test
deps =
    pandas
    black
    click
    attrs  # ghostwriter has an attrs test
allowlist_externals =
    bash
commands_pre =
    bash -c "pip install --upgrade --pre --only-binary :all: -i https://pypi.anaconda.org/scientific-python-nightly-wheels/simple numpy"
commands =
    python -bb -X dev -m pytest tests/numpy/ tests/array_api/ tests/pandas/ tests/ghostwriter/ tests/conjecture/ tests/cover -n auto {posargs}

# Note: when adding or removing tested Pandas versions, make sure to update the
# docs in numpy.rst too.  To see current download rates of each minor version:
# https://pepy.tech/project/pandas?versions=1.1.*&versions=1.2.*&versions=1.3.*&versions=1.4.*&versions=1.5.*&versions=2.0.*&versions=2.1.*&versions=2.2.*
[testenv:py{310,311,312,313}-pandas{11,12,13,14,15,20,21,22}]
package = skip
package_root = ci-matrix
# see the note in ci-matrix/pyproject.toml: --locked can't verify a lock
# that declares conflicts, so these envs use --frozen and CI re-locks instead.
uv_sync_locked = false
uv_sync_flags = --frozen
dependency_groups =
    pandas11: pandas11
    pandas12: pandas12
    pandas13: pandas13
    pandas14: pandas14
    pandas15: pandas15
    pandas20: pandas20
    pandas21: pandas21
    pandas22: pandas22
setenv=
    PYTHONWARNDEFAULTENCODING=1
commands =
    python -bb -X dev -m pytest tests/pandas -n auto

# Adding a new pandas?  See comment above!

[testenv:rest]
dependency_groups = coverage, crosshair

# Our 32-bit Windows jobs, where the newest numpy and pandas have no wheels.
[testenv:alt-{rest,nocover}]
package = skip
package_root = ci-matrix
# see the note in ci-matrix/pyproject.toml: --locked can't verify a lock
# that declares conflicts, so these envs use --frozen and CI re-locks instead.
uv_sync_locked = false
uv_sync_flags = --frozen
dependency_groups = alt

[testenv:crosshair-{cover,nocover,repeat,custom}]
dependency_groups = crosshair
extras =
    zoneinfo
    repeat: numpy
setenv=
    HYPOTHESIS_PROFILE=crosshair
commands =
    # invoke with `./build.sh check-crosshair-cover -- -x -Wignore`
    cover: python -bb -X dev -m pytest -n auto tests/cover/ tests/pytest/ {posargs}
    nocover: python -bb -X dev -m pytest -n auto tests/nocover/ {posargs}
    # Run twice, interleaved by other tests, to make it more probable to tickle any
    # problems from accidentally caching/retaining crosshair proxy objects...
    repeat: python -bb -X dev -m pytest -n auto --count=2 --repeat-scope=session tests/numpy tests/crosshair {posargs}
    # ...but running twice takes time, don't overdo it
    repeat: python -bb -X dev -m pytest -n auto tests/array_api
    custom: python -bb -X dev -m pytest {posargs}

[testenv:django{52,60,-nocontrib}]
package = skip
package_root = ci-matrix
# see the note in ci-matrix/pyproject.toml: --locked can't verify a lock
# that declares conflicts, so these envs use --frozen and CI re-locks instead.
uv_sync_locked = false
uv_sync_flags = --frozen
dependency_groups =
    django52: django52
    django60: django60
    django-nocontrib: django60
setenv=
    PYTHONWARNDEFAULTENCODING=1
    DJANGO_SETTINGS_MODULE=tests.django.toys.settings.settings
    nocontrib: DJANGO_SETTINGS_MODULE=tests.django.toys.settings.settings_no_contrib
commands =
    python -bb -X dev -m tests.django.manage test tests.django {posargs}

[testenv:pytest{54,62,74,84,9}]
package = skip
package_root = ci-matrix
# see the note in ci-matrix/pyproject.toml: --locked can't verify a lock
# that declares conflicts, so these envs use --frozen and CI re-locks instead.
uv_sync_locked = false
uv_sync_flags = --frozen
dependency_groups =
    pytest54: pytest54
    pytest62: pytest62
    pytest74: pytest74
    pytest84: pytest84
    pytest9: pytest9
setenv=
    pytest62: PYTHONWARNDEFAULTENCODING=
commands =
    python -bb -X dev -m pytest tests/pytest tests/cover/test_testdecorators.py

[testenv:threading]
dependency_groups = threading
setenv=
    PYTHONWARNDEFAULTENCODING=1
    HYPOTHESIS_PROFILE=threading
commands =
    python -bb -X dev -m pytest -n auto tests/cover --parallel-threads 3 --skip-thread-unsafe true {posargs}

[testenv:coverage]
dependency_groups = coverage
allowlist_externals =
    rm
setenv=
    PYTHONWARNDEFAULTENCODING=1
    HYPOTHESIS_INTERNAL_COVERAGE=true
    COVERAGE_PROCESS_START=.coveragerc
commands_pre =
    rm -f branch-check*
# Produce a coverage report even if the test suite fails.
# (The tox task will still count as failed.)
ignore_errors = true
# We've had problems correctly measuring coverage using pytest-cov when running
# in parallel, so instead we start coverage implicitly on all (sub-)processes by
# way of the coverage_enable_subprocesses installation. This requires all options
# to be set in .coveragerc (including source), but that's ok as it is overridden
# by --cov=... in conjecture-coverage.
commands =
    python -bb -X dev -m pytest -n auto --ff {posargs} \
        tests/cover tests/conjecture tests/datetime tests/numpy tests/pandas tests/lark \
        tests/redis tests/dpcontracts tests/codemods tests/typing_extensions tests/patching \
        tests/test_annotated_types.py tests/watchdog
    python -m coverage combine
    python -m coverage report
    python scripts/validate_branch_check.py

[testenv:conjecture-coverage]
dependency_groups = coverage
setenv=
    PYTHONWARNDEFAULTENCODING=1
    HYPOTHESIS_INTERNAL_COVERAGE=true
commands =
    python -bb -X dev \
        -m pytest -n auto tests/conjecture/ \
        --cov=hypothesis.internal.conjecture --cov-config=.coveragerc {posargs}
